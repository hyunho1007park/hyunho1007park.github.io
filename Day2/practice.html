<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접속 페이지</title>
</head>
<body>
    <h1>회원가입 홈페이지</h1>
    <h3>회원이 되어 다양한 혜택을 경험해 보세요!</h3>
    <form action="#">
    <label>아이디: <input type="password" name="userid" value="아이디 입력(6~20자)"/> </label> <br><br>
    <label>비밀번호:<input type="password" name="userpassword" value="비밀번호 입력(8~20자)"></label><br><br>
    <label>비밀번호 확인<input type="password" name="checkpassword" value="비밀번호 재입력"></label><br><br>
    <label>이름:<input type="text" name="username" value="이름을 입력하세요"></label><br><br>
    <label>전화번호:<input type="tel" name="userphone" value="휴대폰 번호 입력('-'제외 11자리 입력')"></label><br><br>
    <label>이메일 주소:<input type="email" name="useremail" value="이메일 주소  @  naver.com"> </label><br><br>
    <label>생년월일:<input type="date" name="birthdate"> </label><br><br>
    <input type="submit" value="제출">
    </form>    
</body>
</html>
