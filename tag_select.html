<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="get"> 
        <label for="fruit">과일 선택 시:</label>
        <select id="fruit" name="fruitselect">
            <option value="apple">사과</option>
            <option value="banana" selected>바나나</option>
            <option value="strawberry">딸기</option>
        </select>
        <br/><br/>
        <label for="language">언어 선택 시:</label>
        <select id="language" name="langs" multiple>
            <option value="HTML">html</option>
            <option value="JAVA">java</option>/option>
            <option value="PYTHON">python</option>
        </select>
        
        <label for="nation">국가 선택 시:</label>
        <select id="nation" name="national" multiple>
            <optgroup label="아시아">
                <option value="kr">대한민국</option>
                <option value="jp">일본</option>
            </optgroup>
            <optgroup label="유럽"> 
                <option value="fr">프랑스</option>
                <option value="gm">독일</option>
            </optgroup>
        </select>
        <input type="submit" value="제출"/>
    </form>
</body>
</html>
