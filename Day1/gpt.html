<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>기본 웹 페이지</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    header {
      background-color: #333;
      color: white;
      padding: 16px;
      text-align: center;
    }
    nav {
      background-color: #555;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }
    main {
      padding: 20px;
    }
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>내 첫 웹 페이지</h1>
    <p>HTML 기본 예제입니다</p>
  </header>

  <nav>
    <a href="#">홈</a>
    <a href="#">소개</a>
    <a href="#">연락처</a>
  </nav>

  <main>
    <h2>환영합니다 👋</h2>
    <p>이 페이지는 HTML과 CSS로 만든 아주 기본적인 웹 페이지입니다.</p>
    <p>여기에서 내용을 자유롭게 수정해 보세요.</p>
  </main>

  <footer>
    <p>© 2026 My Website</p>
  </footer>

</body>
</html>
