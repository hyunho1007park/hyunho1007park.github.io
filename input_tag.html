<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#">
        <label>이름: <input type="text" name="username" value="홍길동"/></label> <br/><br/> 
        <label>비밀번호:<input type="password" name="userpassword"/></label><br/><br/>
        <label for="phone">전화번호:</label>
        <input type="tel" id="phone" name="userphone" placeholder="010-1234-5678"/> <br/><br/>
        <label>숫자:<input type="number" min="0" max="10" value="1" name="usernumber"/></label><br/><br/>
        <label>이메일<input type="email"/> </label><br/><br/>
        <label><input type="checkbox" name="hobby" value="reading"/>독서</label>
        <label><input type="checkbox" name="hobby" value="sports"/>운동</label><br/><br/>
        <label><input type="radio" name="gender" value="male"/>남성</label>
        <label><input type="radio" name="gender" value="female"/>여성</label><br/><br/>
        <label><input type="file" name="uploadfile"></label><br/><br/>
        <label>생년월일:<input type="date" name="birthdate"></label><br/><br/>
        <label>좋아하는 색상: <input type="color" name="favcolor"></label><br/><br/>
        <label>만족도(1~10) <input type="range" name="satisfication" min="1" max="10"></label><br/><br/>
        <input type="hidden" name="userid" value="12345">
        <input type="button" value="클릭해도 전송 안 됨"><br/><br/>
        <input type="image" src="submit.png" alt="이미지 전송 버튼" width="100" height="30"><br/><br/>
        <textarea rows="10" cols="10" placeholder="여기에 의견을 남겨주세요" ></textarea>
        <button type="reset">초기화</button>
        <input type="submit" value="제출"/>
    </form>
</body>
</html>
