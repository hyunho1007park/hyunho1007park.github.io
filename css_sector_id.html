<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section span
        {
            color: blue;
        }
        section>span
        {
            color:red;
        }
    </style>
</head>
<body>
    <section>
        <span>이 문장에는 빨간색 적용</span>
        <div>
            <span>이 문장에는 파란색 적용</span>
        </div>
    </section>
    <span>이 문장에는 적용되지 않음</span>
</body>
</html>
